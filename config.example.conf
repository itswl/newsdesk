# newsdesk 配置 —— 改这里就够，不用动任何代码。
#
# 复制为仓库根目录的 config.conf 再填真实值；config.conf 已被 gitignore。
# 全部项都是可选的：只在本机看简报的话，整份文件不存在也能跑。
# 想知道当前实际生效什么，跑 `newsdesk doctor`。

# ── 分析引擎 ──
ENGINE=claude                    # claude | codex | api
CLAUDE_MODEL=claude-sonnet-5
CODEX_MODEL=gpt-5.6-luna

# 主引擎失败时的兜底。三选一：
#   留空   不兜底，失败就跳过当档
#   codex  用本机的 codex CLI（另一个订阅）
#   api    用 claude CLI 连第三方 Anthropic 兼容端点。按量付费不受订阅的用量
#          窗口约束，但有自己的失败方式（余额不足、限流、key 失效）——是另一个
#          独立的失败源，不是保证能跑
ENGINE_FALLBACK=

# ENGINE_FALLBACK=api 时这三个才有用，英文翻译也走这一套。
#   DeepSeek : https://api.deepseek.com/anthropic      模型 deepseek-flash
#   智谱 GLM : https://open.bigmodel.cn/api/anthropic  模型 glm-5.3
# 地址带不带 /v1 都可以，程序会归一化——带了会拼成 /v1/v1/messages，实测 404。
FALLBACK_BASE_URL=
FALLBACK_AUTH_TOKEN=
FALLBACK_MODEL=


# ── 采集 ──
# GitHub 令牌是可选的，别让它变回必需：Trending 采集按约 50 次 API 调用设计，
# 为的是装进未认证的 60 次/小时预算，核心字段全部保留。预算不足时会跳过部分
# 仓库和下载量指标，并在报告里说明缺口。
# 填了则预算变 5000。留空时若本机装了 gh 且已登录会借用它的令牌；
# 想显式不认证就填 none。
GITHUB_TOKEN=

AINEWS_HOURS=36                  # AI 简报只保留这个时间窗内的条目
AINEWS_PER_FEED=12
DOUBAN_TAG=热门
DOUBAN_N=10
DOUBAN_SORT=recommend            # recommend | time | rank
TRENDING_TIER=t3


# ── 告警（强烈建议配）──
# 不配也能跑，但这条流水线的失败闭环只写在报告和站点状态条里，那只有
# 「已经打开页面的人」才看得见。整条停摆（机器没开、调度器挂了、沙箱自检不过
# 导致拒绝运行）不会有任何人知道——最安全的失败方式同时也是最沉默的。
#
# 任务终局失败、错过补跑、调度循环连续异常、日终核对有缺口，都会推一条。
# 中间的重试不推：每次都推等于教人忽略告警。
ALERT_WEBHOOK=
# 自定义 POST 体（各家形状不同）。留空用 {"title":..,"text":..}。
#   飞书/Lark: {"msg_type":"text","content":{"text":"{{TEXT}}"}}
#   钉钉:      {"msgtype":"text","text":{"content":"{{TEXT}}"}}
#   Slack:     {"text":"{{TEXT}}"}
ALERT_PAYLOAD=
# ⚠️ 飞书/Lark、钉钉、企业微信**错误也返回 HTTP 200**，把失败写在 body 的
# code/errcode 里。程序会一并检查 body，所以体写错时报的是「发送失败」而不是
# 假装成功——告警通道静默失效比没有告警更糟，因为你以为自己有。

AUDIT_AT=23:30                   # 日终核对时刻：核对今天四档是否齐全

# ⚠️ 本机的调度器报不了自己的死：机器关了、进程被杀，它没机会发任何东西。
# 覆盖「整机不在」要靠 ts/ 里那个 Worker 定时轮询站点上的 status.json。
# 只有配了 PUBLISH_BUCKET 才会发布这个文件。


# ── 对外发布（可选）──
# 只在本机看简报的话，下面几项全部留空即可：备份与发布会自动跳过，
# 静态站在 site/ 下，浏览器直接打开就能看。
BACKUP_BUCKET=                   # 私有桶：data/ + reports/ + site/ 全量备份
PUBLISH_BUCKET=                  # 公开桶：只放 site/
BACKUP_NAMESPACE=                # 留空自动探测
OCI_CONFIG=                      # 留空用 ~/.oci/config
OCI_PROFILE=                     # 留空用 DEFAULT

# 对外只保留最近多少天。留空或 0 = 不限制。
# 只影响发布：本地 site/ 与私有桶备份始终是全量，reports/ 里的原文也不受影响。
# 改小之后，公开桶里超窗的旧页面会在下次发布时被**删掉**——不只是不再放链接，
# 是按 URL 也取不到（桶列不出清单，但地址是能猜的）。
PUBLIC_DAYS=

# 对外发布哪些语言（逗号分隔，第一个是默认、放在站点根目录）。留空 = 只发简体。
#   zh-CN  简体，模型直接产出
#   zh-TW  繁体，由简体现转（台湾用词），转换表编译进二进制，零调用零依赖
#   en     英文，预先翻好；走 FALLBACK_* 那套按量付费配置，不吃订阅的用量窗口。
#          每天约 10 万 token。
#
# ⚠️ 「列进来」不等于「开启」：en 还需要 FALLBACK_* 三项齐备。缺依赖的语言会被
# 剔除并说明原因，其余照常发布——不因为英文没配好就把整条线停掉。
# 看当前实际生效哪些：`newsdesk langs`
SITE_LANGS=


# ── 站点声明 ──
# 对外地址，用于生成 Atom feed（feed 里的链接必须是绝对地址）。
# 留空则不生成 feed——只在本机看的话不需要。
SITE_URL=
# 侵权联系方式，显示在每页页脚。留空则只显示「请与本站联系」不给出具体地址。
CONTACT=


# ── 手机推送（可选）──
# 新简报出炉时给已安装到主屏的 webapp 推一条系统通知。故障与停更**不走这里**，
# 仍然走 ALERT_WEBHOOK——机器没了要去人一定看得到的地方。
#
# 留空则页面上不出现通知开关，整条链路静默关闭。
#
# 生成一对（P-256）：
#   node -e 'const{webcrypto:c}=require("node:crypto");const b=b=>Buffer.from(b).toString("base64url");
#   c.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign"]).then(async k=>{
#     console.log("PUSH_VAPID_PUBLIC="+b(await c.subtle.exportKey("raw",k.publicKey)));
#     console.log("PUSH_VAPID_PRIVATE_KEY="+b(await c.subtle.exportKey("pkcs8",k.privateKey)))})'
#
# 公钥按设计印在每一个页面里（浏览器订阅时要用），所以名字里**不能带 KEY**——
# 发布前的凭据自检按名字收集配置值，带 KEY 会让每次发布都因「产出里有凭据」而中止。
PUSH_VAPID_PUBLIC=
# 私钥只用来在换机器时重新注入 Worker（`wrangler secret put PUSH_VAPID_PRIVATE_KEY`）。
# 名字里的 KEY 是有意的：它必须被发布前自检收走。
PUSH_VAPID_PRIVATE_KEY=
