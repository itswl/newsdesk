name: CI

# 和本机 `make check` 是同一件事：fmt、vet、Go 测试、Worker 测试与 typecheck。
# 公开仓库 Actions 分钟不限，推上来就跑一遍。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make check
