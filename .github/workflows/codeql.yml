# Code scanning for the Python sources (CodeQL's python queries cover data flow into
# subprocess/HTTP/fs sinks). Findings appear under Security → Code scanning once the
# repository has code scanning available.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3
